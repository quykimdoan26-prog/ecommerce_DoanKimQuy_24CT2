<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard · Quý Shop Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1C2430;
            --ink-soft: #4B5361;
            --cream: #FAF7F2;
            --sand: #EDE6D9;
            --sand-line: #DCD2BF;
            --gold: #B8873D;
            --gold-deep: #96692A;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            color: var(--ink);
            background: var(--cream);
        }

        a { color: inherit; }

        .layout {
            display: grid;
            grid-template-columns: 232px 1fr;
            min-height: 100vh;
        }

        /* ---------- Sidebar ---------- */
        .sidebar {
            background: var(--ink);
            padding: 28px 20px;
            display: flex;
            flex-direction: column;
        }

        .brand-mark {
            display: flex;
            align-items: baseline;
            gap: 9px;
            text-decoration: none;
            margin-bottom: 8px;
            padding: 0 6px;
        }

        .brand-mark .tag {
            width: 10px;
            height: 10px;
            border: 1.5px solid var(--gold);
            border-radius: 2px;
            transform: rotate(45deg);
            position: relative;
            top: -1px;
        }

        .brand-mark span {
            font-family: 'Fraunces', serif;
            font-size: 18px;
            font-weight: 500;
            color: var(--cream);
        }

        .sidebar-tag {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--gold);
            padding: 0 6px;
            margin-bottom: 30px;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex: 1;
        }

        .sidebar-nav a {
            font-size: 14.5px;
            color: rgba(250, 247, 242, 0.72);
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 6px;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .sidebar-nav a:hover { background: rgba(250, 247, 242, 0.06); color: var(--cream); }

        .sidebar-nav a.active {
            background: rgba(184, 135, 61, 0.15);
            color: var(--cream);
            font-weight: 600;
        }

        .sidebar-divider {
            height: 1px;
            background: rgba(250, 247, 242, 0.1);
            margin: 16px 6px;
        }

        .sidebar-nav a.exit {
            color: rgba(250, 247, 242, 0.55);
        }

        .btn-logout {
            width: 100%;
            margin-top: 8px;
            padding: 10px 12px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            color: var(--ink);
            background: var(--cream);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .btn-logout:hover { background: #EDE6D9; }

        /* ---------- Main ---------- */
        .main { display: flex; flex-direction: column; }

        .topbar {
            padding: 32px 40px;
            border-bottom: 1px solid var(--sand-line);
        }

        .topbar h1 {
            font-family: 'Fraunces', serif;
            font-size: 26px;
            font-weight: 500;
            margin: 0 0 6px;
        }

        .topbar p {
            font-size: 14.5px;
            color: var(--ink-soft);
            margin: 0;
        }

        .content { padding: 36px 40px 60px; }

        /* Stats */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 36px;
        }

        .stat-card {
            background: #fff;
            border: 1px solid var(--sand-line);
            border-radius: 10px;
            padding: 26px 26px 22px;
        }

        .stat-label {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--gold-deep);
            margin-bottom: 12px;
        }

        .stat-number {
            font-family: 'Fraunces', serif;
            font-size: 34px;
            font-weight: 600;
            color: var(--ink);
            line-height: 1;
        }

        .stat-number.muted {
            font-size: 20px;
            color: #A39C8C;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
        }

        /* Quick actions */
        .actions-card {
            background: #fff;
            border: 1px solid var(--sand-line);
            border-radius: 10px;
            padding: 30px 30px 28px;
        }

        .actions-card h2 {
            font-family: 'Fraunces', serif;
            font-size: 17px;
            font-weight: 500;
            margin: 0 0 20px;
        }

        .actions-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            padding: 11px 18px;
            border-radius: 6px;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .action-btn.primary {
            background: var(--ink);
            color: var(--cream);
        }

        .action-btn.primary:hover { background: #2A3444; }

        .action-btn.secondary {
            background: #fff;
            color: var(--ink);
            border: 1px solid var(--sand-line);
        }

        .action-btn.secondary:hover { border-color: var(--gold); color: var(--gold-deep); }

        @media (max-width: 860px) {
            .layout { grid-template-columns: 1fr; }
            .sidebar { min-height: auto; }
            .stat-grid { grid-template-columns: 1fr; }
            .topbar, .content { padding-left: 24px; padding-right: 24px; }
        }
    </style>
</head>
<body>
    <div class="layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <a class="brand-mark" href="/">
                <span class="tag"></span>
                <span>Quý Shop</span>
            </a>
            <p class="sidebar-tag">XIN CHÀO QUẢN TRỊ</p>

            <nav class="sidebar-nav">
                <a href="/admin/dashboard" class="active">Dashboard</a>
                <a href="/admin/products">Quản lý sản phẩm</a>
                <a href="/admin/orders">Quản lý đơn hàng</a>
                <a href="/admin/users" sec:authorize="hasRole('ADMIN')">Tài Khoản Khách Hàng</a>

                <div class="sidebar-divider"></div>
                <a href="/" class="exit">Về trang chủ</a>
            </nav>

            <form action="/logout" method="post">
                <button class="btn-logout" type="submit">Đăng xuất</button>
            </form>
        </aside>

        <!-- Main -->
        <div class="main">
            <div class="topbar">
                <h1>Dashboard</h1>
                <p>Tổng quan hệ thống bán hàng Quý Shop.</p>
            </div>

            <div class="content">
                <div class="stat-grid">
                    <div class="stat-card">
                        <p class="stat-label">SẢN PHẨM</p>
                        <p class="stat-number" th:text="${totalProducts}">0</p>
                    </div>
                    <div class="stat-card">
                        <p class="stat-label">ĐƠN HÀNG CHỜ XỬ LÝ</p>
                        <p class="stat-number" th:text="${pendingOrders}">0</p>
                    </div>
                    <div class="stat-card">
                        <p class="stat-label">DOANH THU</p>
                        <p class="stat-number muted" th:text="'₫' + ${#numbers.formatInteger(totalRevenue, 0, 'COMMA')}">Chưa có dữ liệu</p>
                    </div>
                </div>

                <div class="actions-card">
                    <h2>Quản lý nhanh</h2>
                    <div class="actions-row">
                        <a href="/admin/products/add" class="action-btn primary">Thêm sản phẩm</a>
                        <a href="/admin/products" class="action-btn secondary">Xem sản phẩm</a>
                        <a href="/admin/orders" class="action-btn secondary">Xem đơn hàng</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
